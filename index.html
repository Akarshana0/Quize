    <style>
        :root {
            --primary: #00f260;
            --secondary: #0575E6;
            --gold: #FFD700;
            --danger: #ff4757;
            --glass: rgba(16, 23, 41, 0.95);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Rajdhani', 'Noto Sans Sinhala', sans-serif;
            background: radial-gradient(circle at center, #0f0c29 0%, #302b63 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- 1. ADVANCED ALERT SYSTEM STYLES --- */
        #custom-alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            z-index: 20000; /* Top most layer */
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #custom-alert-overlay.active { opacity: 1; pointer-events: all; }

        .alert-box {
            background: rgba(16, 23, 41, 0.95);
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 242, 96, 0.3);
            width: 90%; max-width: 400px;
            padding: 30px; border-radius: 20px;
            text-align: center;
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #custom-alert-overlay.active .alert-box { transform: scale(1); }

        .alert-icon { font-size: 3rem; margin-bottom: 15px; }
        .alert-title { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; }
        .alert-msg { color: #ccc; margin-bottom: 25px; line-height: 1.5; font-size: 1rem; }
        
        .alert-btns { display: flex; justify-content: center; gap: 15px; }
        .al-btn {
            padding: 10px 25px; border-radius: 50px; cursor: pointer; font-family: 'Rajdhani'; font-weight: bold; font-size: 1rem; transition: 0.2s; border: none;
        }
        .btn-ok { background: var(--primary); color: black; box-shadow: 0 0 15px rgba(0, 242, 96, 0.4); }
        .btn-ok:hover { transform: scale(1.05); background: white; }
        .btn-cancel { background: transparent; border: 1px solid #aaa; color: #aaa; }
        .btn-cancel:hover { border-color: white; color: white; }

        /* Danger Theme for Alert */
        .alert-box.danger { border-color: var(--danger); box-shadow: 0 0 30px rgba(255, 71, 87, 0.3); }
        .alert-box.danger .alert-title { color: var(--danger); }
        .alert-box.danger .btn-ok { background: var(--danger); color: white; box-shadow: 0 0 15px rgba(255, 71, 87, 0.4); }


        /* --- 2. EXISTING STYLES (Keep everything else same) --- */
        #loading-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #000000 100%);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        .loading-logo {
            width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
            border: 4px solid var(--primary); box-shadow: 0 0 30px var(--primary), 0 0 60px var(--secondary);
            margin-bottom: 30px; animation: logoPulse 2s infinite ease-in-out;
        }
        @keyframes logoPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .load-text { font-family: 'Noto Sans Sinhala', serif; font-size: 1.4rem; color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); transition: opacity 0.5s ease-in-out; }
        .start-btn { margin-top: 30px; padding: 12px 40px; background: transparent; border: 2px solid var(--primary); color: var(--primary); font-size: 1.2rem; cursor: pointer; border-radius: 30px; font-weight: bold; transition: 0.3s; }
        .start-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }

        .toolbar { height: 70px; background: var(--glass); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; }
        .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--primary); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .xp-badge { background: rgba(0, 242, 96, 0.1); border: 1px solid var(--primary); padding: 5px 20px; border-radius: 30px; text-align: center; }
        .xp-val { font-size: 1.2rem; font-weight: bold; color: white; }
        .clock { font-size: 1.2rem; font-weight: bold; color: #ccc; }

        .app-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 20px auto; }
        .back-btn { background: transparent; border: 1px solid #aaa; color: #aaa; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { border-color: white; color: white; background: rgba(255,255,255,0.1); }
        .exit-btn { border-color: var(--danger); color: var(--danger); }
        .exit-btn:hover { background: var(--danger); color: white; }

        .card-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { width: 260px; height: 320px; background: linear-gradient(145deg, #1a1a2e, #16213e); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.4s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--secondary); box-shadow: 0 10px 40px rgba(5, 117, 230, 0.2); }
        .card-emoji { font-size: 4rem; margin-bottom: 20px; filter: grayscale(1); transition: 0.4s; }
        .card:hover .card-emoji { filter: grayscale(0); transform: scale(1.1); }

        .level-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; max-width: 1000px; margin: 0 auto; }
        .lvl-box { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #888; }
        .lvl-box.unlocked { border-color: var(--primary); background: rgba(0, 242, 96, 0.05); color: white; }
        .lvl-box.completed { border-color: var(--gold); color: var(--gold); background: rgba(255, 215, 0, 0.1); }
        .lvl-box.locked { opacity: 0.3; pointer-events: none; background: #000; }

        .quiz-panel { max-width: 700px; margin: 0 auto; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid var(--border); }
        .ans-btn { width: 100%; padding: 15px; margin-bottom: 10px; text-align: left; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #ccc; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .ans-btn:hover { background: var(--secondary); border-color: var(--secondary); color: white; }
        .ans-btn.correct { background: #00b894; border-color: #00b894; color: black; font-weight: bold; }
        .ans-btn.wrong { background: #d63031; border-color: #d63031; color: white; }

        .hide { display: none !important; }
        @media (max-width: 600px) { .loading-logo { width: 100px; height: 100px; } .card { width: 100%; height: 100px; flex-direction: row; justify-content: flex-start; padding: 0 20px; } .card-emoji { font-size: 2.5rem; margin-bottom: 0; margin-right: 20px; } }
    </style>
</head>

    <script>
        /* --- 1. ADVANCED ALERT SYSTEM LOGIC --- */
        const alertOverlay = document.getElementById('custom-alert-overlay');
        const alertBox = document.getElementById('alert-box-inner');
        const alertTitle = document.getElementById('alert-title');
        const alertMsg = document.getElementById('alert-msg');
        const alertBtns = document.getElementById('alert-btns');
        const alertIcon = document.getElementById('alert-icon');

        function showAlert(title, msg, type = 'info', callback = null) {
            alertOverlay.classList.add('active');
            alertTitle.innerText = title;
            alertMsg.innerText = msg;
            alertBtns.innerHTML = '';

            // Styling based on Type
            alertBox.className = 'alert-box'; // reset
            if(type === 'danger') {
                alertBox.classList.add('danger');
                alertIcon.innerText = '⚠️';
            } else if(type === 'success') {
                alertIcon.innerText = '✅';
            } else {
                alertIcon.innerText = 'ℹ️';
            }

            // Buttons
            if(type === 'confirm' || type === 'danger') {
                const yesBtn = document.createElement('button');
                yesBtn.className = 'al-btn btn-ok';
                yesBtn.innerText = 'YES';
                yesBtn.onclick = () => { closeAlert(); if(callback) callback(); };
                
                const noBtn = document.createElement('button');
                noBtn.className = 'al-btn btn-cancel';
                noBtn.innerText = 'NO';
                noBtn.onclick = closeAlert;

                alertBtns.appendChild(noBtn);
                alertBtns.appendChild(yesBtn);
            } else {
                const okBtn = document.createElement('button');
                okBtn.className = 'al-btn btn-ok';
                okBtn.innerText = 'OK';
                okBtn.onclick = () => { closeAlert(); if(callback) callback(); };
                alertBtns.appendChild(okBtn);
            }
        }

        function closeAlert() {
            alertOverlay.classList.remove('active');
        }

        /* --- 2. MAIN LOGIC INTEGRATION --- */
        const audio = document.getElementById('bg-audio');
        const quotes = ["දැනුම යනු බලයයි.", "උත්සාහවන්තයා ජය ගනී.", "හෙට ලොව ඔබ සතුයි.", "ජයග්‍රහණය ළඟයි."];
        let qIdx = 0;

        function cycleQuotes() {
            const el = document.getElementById('quote-text'); el.style.opacity = 0;
            setTimeout(() => { el.innerText = quotes[qIdx]; qIdx = (qIdx + 1) % quotes.length; el.style.opacity = 1; }, 500);
        }
        setInterval(cycleQuotes, 3000);

        function initSystem() {
            audio.volume = 0.5;
            audio.play().catch(() => {});
            document.getElementById('play-btn').innerText = "⏸";
            document.getElementById('loading-layer').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('loading-layer').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                // Show Welcome Alert
                showAlert("SYSTEM ONLINE", "Welcome to Raviya A/L Quiz System.", "success");
            }, 800);
        }

/* --- COMPLETE QUESTION BANK (LEVELS 1-15) --- */

                    { q: "නිෂ්පාදන සාධක අතරින් 'ඉඩම්' සඳහා ලැබෙන ප්‍රතිලාභය කුමක්ද?", a: ["වැටුප්", "බදු කුලී", "පොලිය", "ලාභය"], c: 1 },

                    { q: "නිෂ්පාදන හැකියා මායිම් වක්‍රය (PPC) සාමාන්‍යයෙන් මූල ලක්ෂ්‍යයට,", a: ["උත්තල වේ", "අවම වේ", "සරල රේඛීය වේ", "සමාන්තර වේ"], c: 0 },

                    { q: "පුද්ගලික විකිණීම (Personal Selling) වඩා සුදුසු,", a: ["සංකීර්ණ සහ මිල අධික භාණ්ඩ විස්තර කර විකිණීමට", "සබන් විකුණන්න", "පාන් විකුණන්න", "ටොෆි විකුණන්න"], c: 0 },
                    { q: "විකුණුම් ප්‍රවර්ධනය (Sales Promotion) ඉලක්ක කරන්නේ,", a: ["කෙටි කාලීනව විකුණුම් වැඩි කර ගැනීමට (Offers)", "දිගු කාලීනව", "ප්‍රතිරූපය හදන්න", "සේවකයන්ට"], c: 0 },
                    { q: "මහජන සම්බන්ධතා (PR) මගින් කරන්නේ,", a: ["මාධ්‍ය නිවේදන, උත්සව හරහා හොඳ නම (Goodwill) හැදීම", "බඩු විකිණීම", "දැන්වීම් දැමීම", "සල්ලි දීම"], c: 0 },
                    { q: "සෘජු අලෙවිකරණය (Direct Marketing) යනු,", a: ["තැපැල්, දුරකථන, Email මගින් කෙලින්ම ගනුදෙනුකරු ඇමතීම", "TV දැන්වීම්", "පෝස්ටර්", "කඩේට යෑම"], c: 0 },
                    { q: "ඒකාබද්ධ අලෙවිකරණ සන්නිවේදනය (IMC) යනු,", a: ["සියලු ප්‍රවර්ධන ක්‍රම එකම පණිවිඩයක් දෙන ලෙස සම්බන්ධ කිරීම", "වෙන වෙනම කිරීම", "නොකිරීම", "රණ්ඩු කිරීම"], c: 0 },

                    { q: "ඩිජිටල් අලෙවිකරණය (Digital Marketing) යනු,", a: ["සමාජ මාධ්‍ය සහ අන්තර්ජාලය හරහා ප්‍රවර්ධනය", "TV බැලීම", "පත්තර බැලීම", "රේඩියෝව"], c: 0 }
                ],

                27: [ // Level 27: නායකත්වය සහ අභිප්‍රේරණය

                31: [ // Level 31: මූල්‍ය - අනුපාත විශ්ලේෂණය
                    { q: "ජංගම අනුපාතය (Current Ratio) මගින් මනින්නේ,", a: ["කෙටි කාලීන ණය ගෙවීමේ හැකියාව (ද්‍රවශීලතාව)", "ලාභදායිත්වය", "කාර්යක්ෂමතාව", "ස්ථාවරත්වය"], c: 0 },
                    { q: "ආයෝජිත ප්‍රාග්ධනය මත ප්‍රතිලාභය (ROI) සොයන්නේ,", a: ["(ශුද්ධ ලාභය / ආයෝජිත ප්‍රාග්ධනය) x 100", "ලාභය / විකුණුම්", "වත්කම් / ණය", "විකුණුම් / තොග"], c: 0 },
                    { q: "දළ ලාභ අනුපාතය (GP Ratio) අඩු වීමට හේතුවක්,", a: ["විකුණුම් මිල අඩු වීම හෝ නිෂ්පාදන පිරිවැය වැඩි වීම", "විකුණුම් වැඩි වීම", "වියදම් අඩු වීම", "හොඳ පාලනය"], c: 0 },
                    { q: "ශීඝ්‍ර අනුපාතය (Quick Ratio) ගණනය කිරීමේදී ජංගම වත්කම් වලින් අඩු කරන්නේ,", a: ["තොගය (Inventory)", "ණය ගැතියන්", "මුදල්", "බැංකු ශේෂ"], c: 0 },

                    { q: "P/E Ratio (මිල ඉපැයුම් අනුපාතය) = ?", a: ["වෙළඳපොළ මිල / EPS", "EPS / මිල", "ලාභය / මිල", "මිල / ලාභය"], c: 0 },

                ],
                32: [ // Level 32: රක්ෂණය - මූලධර්ම

                    { q: "Off Balance Sheet Financing යනු,", a: ["වත්කම් හෝ වගකීම් ශේෂ පත්‍රයේ නොපෙන්වා තබා ගැනීම (දැන් අඩුයි)", "ණය ගැනීම", "හොඳ දෙයක්", "නීතිමය දෙයක්"], c: 0 },

                    { q: "Forensic Accounting වැදගත් වන්නේ,", a: ["උසාවියට ඉදිරිපත් කළ හැකි මට්ටමේ මූල්‍ය සාක්ෂි සෙවීමට", "ගිණුම් ලියන්න", "බදු ගෙවන්න", "රක්ෂණයට"], c: 0 },

                    { q: "Earnings Management (ඉපැයුම් කළමනාකරණය),", a: ["ලාභය කෘතිමව ස්ථාවර කර පෙන්වීම (Smoothing)", "හොඳ දෙයක්", "ලාභ වැඩි කිරීම", "බදු අඩු කිරීම"], c: 0 },
                    { q: "Professional Skepticism (වෘත්තීය සංශයවාදය) විගණක,", a: ["කිසිවක් එක එල්ලේ විශ්වාස නොකර ප්‍රශ්න කිරීමේ මනසකින් සිටීම", "සැක කිරීම", "විශ්වාස කිරීම", "තරහ වීම"], c: 0 },
                    { q: "ගිණුම්කරණයේ අනාගතය,", a: ["AI, Blockchain සහ දත්ත විද්‍යාව සමඟ ඒකාබද්ධ වීම", "පොත් ලිවීම", "ගණක යන්ත්‍ර", "අතීතයමයි"], c: 0 }

            }
        };
        function getQuizData(sub, lvl) {
            if(questionBank[sub][lvl]) return questionBank[sub][lvl];
            let arr = [];
            for(let i=0; i<10; i++) {
                arr.push({ q: `(${sub.toUpperCase()}) Level ${lvl} - Question ${i+1}?`, a: ["Option 1", "Option 2", "Option 3", "Option 4"], c: 0 });
            }
            return arr;
        }

        const MAX_LVL = 100;
        let progress = { econ: 1, bs: 1, acc: 1 };
        let totalXP = 0;
        let curSub = '', curLvl = 1, score = 0, qNum = 0, qData = [];

        function openLevelGrid(sub) {
            curSub = sub; switchScreen('screen-levels'); document.getElementById('subj-title').innerText = sub.toUpperCase();
            const grid = document.getElementById('level-grid'); grid.innerHTML = '';
            for(let i=1; i<=MAX_LVL; i++) {
                const btn = document.createElement('div');
                const unlocked = i <= progress[sub]; const completed = i < progress[sub];
                btn.className = `lvl-box ${completed ? 'completed' : unlocked ? 'unlocked' : 'locked'}`;
                btn.innerHTML = `<span style="font-weight:bold;">${i}</span><span>${completed ? '⭐' : unlocked ? '🔓' : '🔒'}</span>`;
                if(unlocked) btn.onclick = () => runQuiz(i);
                grid.appendChild(btn);
            }
        }

        function runQuiz(lvl) {
            curLvl = lvl; qData = getQuizData(curSub, lvl); qNum = 0; score = 0;
            switchScreen('screen-quiz'); document.getElementById('quiz-lvl-info').innerText = `${curSub.toUpperCase()} - LEVEL ${lvl}`; loadQuestion();
        }

        function loadQuestion() {
            const q = qData[qNum]; document.getElementById('q-text').innerText = q.q;
            const box = document.getElementById('opt-box'); box.innerHTML = '';
            q.a.forEach((ans, i) => {
                const btn = document.createElement('button'); btn.className = 'ans-btn'; btn.innerText = ans; btn.onclick = () => ansClick(i, q.c, btn); box.appendChild(btn);
            });
            document.getElementById('next-btn').classList.add('hide');
        }

        function ansClick(idx, correct, btn) {
            const all = document.getElementById('opt-box').children; for(let b of all) b.disabled = true;
            if(idx === correct) { btn.classList.add('correct'); score++; updateXP(10); } else { btn.classList.add('wrong'); all[correct].classList.add('correct'); }
            const nxt = document.getElementById('next-btn'); nxt.classList.remove('hide');
            if(qNum === 9) { nxt.innerText = "FINISH LEVEL"; nxt.onclick = showResults; } else { nxt.innerText = "NEXT QUESTION"; nxt.onclick = nextQ; }
        }

        function nextQ() { qNum++; loadQuestion(); }

        function showResults() {
            switchScreen('screen-result'); const passed = score >= 7;
            document.getElementById('res-icon').innerText = passed ? "🏆" : "❌";
            document.getElementById('res-msg').innerText = passed ? "LEVEL PASSED" : "FAILED";
            document.getElementById('res-msg').style.color = passed ? "var(--primary)" : "var(--danger)";
            document.getElementById('res-score').innerText = `${score} / 10`;
            if(passed && curLvl === progress[curSub] && curLvl < MAX_LVL) progress[curSub]++;
            
            // Optional: Alert on success
            if(passed) showAlert("CONGRATULATIONS!", `You passed Level ${curLvl} with ${score}/10!`, "success");
        }

        /* --- NAVIGATION --- */
        function switchScreen(id) { document.querySelectorAll('.app-content > div').forEach(d => d.classList.add('hide')); document.getElementById(id).classList.remove('hide'); }
        function goHome() { switchScreen('screen-home'); }
        
        // NEW: Custom Alert for Exit
        function attemptExit() {
            showAlert("EXIT QUIZ?", "Are you sure you want to leave? Progress will be lost.", "danger", () => {
                openLevelGrid(curSub);
            });
        }
        
        function backToLevels() { openLevelGrid(curSub); }
        function retryLvl() { runQuiz(curLvl); }
        function updateXP(n) { totalXP += n; document.getElementById('xp-disp').innerText = totalXP + " XP"; }

        function togglePlay() { if(audio.paused) { audio.play(); document.getElementById('play-btn').innerText="⏸"; } else { audio.pause(); document.getElementById('play-btn').innerText="▶"; }}
        function toggleMute() { audio.muted = !audio.muted; }
        setInterval(() => { const d = new Date(); document.getElementById('clock').innerText = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }, 1000);

    </script>
